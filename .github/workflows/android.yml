name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Android Keystore for CI
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Lint Analysis
        run: ./gradlew lintVitalRelease --stacktrace

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Generate Checksums
        run: |
          cd app/build/outputs/apk/release/
          sha256sum *.apk > checksums.txt || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ElPiedrero-Release-APK
          path: app/build/outputs/apk/release/
          retention-days: 14

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ElPiedrero-Release-Bundle
          path: app/build/outputs/bundle/release/
          retention-days: 14
